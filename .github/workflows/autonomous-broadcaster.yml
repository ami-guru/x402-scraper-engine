name: Autonomous Ecosystem Broadcaster

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  broadcast:
    name: Discovery Ping & On-Chain Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Broadcast to Agent Indexers & Audit Treasury
        run: npx tsx scripts/check-x402-status.ts
