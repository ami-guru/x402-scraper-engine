name: x402-scraper-engine
version: 1.3.0
description: Production HTTP 402 Agent Intelligence Suite - Scraper ($0.005), Edge LLM Digest ($0.025), Security Audit ($0.080), Deep Search ($0.050), and Twitter/X Intelligence ($0.050) on Base L2
repository: https://github.com/ami-guru/x402-scraper-engine
homepage: https://getguruautomations.com
license: MIT
startCommand:
  type: stdio
  config:
    command: npx
    args:
      - tsx
      - client/mcp-server.ts
    env:
      WORKER_URL: https://x402-scraper-engine.gejoe-tt.workers.dev
      BASE_RPC_URL: https://mainnet.base.org
      AGENT_PRIVATE_KEY: ""
tools:
  - name: clean_web_scrape
    description: Scrapes any public webpage and returns clean, sanitized, token-efficient Markdown with autonomous HTTP 402 micro-settlement on Base (0.005 USDC).
    parameters:
      type: object
      properties:
        url:
          type: string
          description: The target webpage URL to scrape.
      required:
        - url
  - name: synthesize_web_digest
    description: Scrapes target webpage and executes Edge LLM (Llama 3) context synthesis extracting executive summary & structured entities (0.025 USDC).
    parameters:
      type: object
      properties:
        url:
          type: string
          description: The webpage URL to synthesize.
        focus:
          type: string
          description: Optional focus area.
      required:
        - url
  - name: audit_web_signal
    description: Performs security, credibility, and phishing risk analysis for any website or smart contract landing page (0.080 USDC).
    parameters:
      type: object
      properties:
        url:
          type: string
          description: The webpage URL to audit for security signals.
        contract_address:
          type: string
          description: Optional 0x EVM smart contract address.
      required:
        - url
  - name: clean_web_search
    description: Performs deep web research across multiple sources with autonomous HTTP 402 micro-settlement on Base (0.05 USDC).
    parameters:
      type: object
      properties:
        query:
          type: string
          description: Search query for deep research.
        limit:
          type: number
          description: Max number of top results to summarize (default 3).
      required:
        - query
  - name: twitter_search
    description: Searches public tweets, cashtags ($BTC, $BASE), and sentiment across Twitter/X without the $100/mo API fee (0.05 USDC).
    parameters:
      type: object
      properties:
        query:
          type: string
          description: Twitter search query or cashtag.
        limit:
          type: number
          description: Max number of tweets (default 5).
      required:
        - query
  - name: twitter_profile_lookup
    description: Extracts public Twitter/X profile bio and recent tweets without the $100/mo API fee (0.03 USDC).
    parameters:
      type: object
      properties:
        username:
          type: string
          description: The Twitter handle/username.
      required:
        - username
