name: x402-scraper-engine
version: 1.2.0
description: Production HTTP 402 Web3 Microtransaction Scraper ($0.02), Deep Search ($0.05), and Twitter/X Intelligence Tool ($0.05) for AI Agents on Base L2
repository: https://github.com/ami-guru/x402-scraper-engine
homepage: https://getguruautomations.com
license: MIT
startCommand:
  type: stdio
  config:
    command: npx
    args:
      - tsx
      - client/mcp-server.ts
    env:
      WORKER_URL: https://x402-scraper-engine.gejoe-tt.workers.dev
      BASE_RPC_URL: https://mainnet.base.org
      AGENT_PRIVATE_KEY: ""
tools:
  - name: clean_web_scrape
    description: Scrapes any public webpage and returns clean, sanitized, token-efficient Markdown with autonomous HTTP 402 micro-settlement on Base (0.02 USDC).
    parameters:
      type: object
      properties:
        url:
          type: string
          description: The target webpage URL to scrape.
      required:
        - url
  - name: clean_web_search
    description: Performs deep web research across multiple sources, extracting clean Markdown summaries from top results with autonomous HTTP 402 micro-settlement on Base (0.05 USDC).
    parameters:
      type: object
      properties:
        query:
          type: string
          description: Search query for deep research.
        limit:
          type: number
          description: Max number of top results to summarize (default 3).
      required:
        - query
  - name: twitter_search
    description: Searches public tweets, cashtags ($BTC, $BASE), and sentiment across Twitter/X without the $100/mo API fee with autonomous HTTP 402 settlement on Base (0.05 USDC).
    parameters:
      type: object
      properties:
        query:
          type: string
          description: Twitter search query or cashtag.
        limit:
          type: number
          description: Max number of tweets (default 5).
      required:
        - query
  - name: twitter_profile_lookup
    description: Extracts public Twitter/X profile bio and recent tweets without the $100/mo API fee with autonomous HTTP 402 settlement on Base (0.03 USDC).
    parameters:
      type: object
      properties:
        username:
          type: string
          description: The Twitter handle/username.
      required:
        - username
